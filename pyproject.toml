[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mongol-history-agent"
version = "0.2.0"
description = "Multilingual, citation-first agentic research assistant for Mongolian history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "rank-bm25>=0.2.2",
  "pypdf>=4.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0"]

[project.scripts]
mha = "mha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
