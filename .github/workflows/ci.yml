name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Хүнд model (torch) суулгахгүй: тестүүд хуурамч embedder ашигладаг
      - run: pip install pytest chromadb rank-bm25 numpy google-genai
      - run: pytest -q
